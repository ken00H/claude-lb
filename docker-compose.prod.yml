# Production Docker Compose — PostgreSQL backend
# Usage:
#   cp .env.example .env.local   # fill in secrets
#   docker compose -f docker-compose.prod.yml up -d
#
# Requires external PostgreSQL. Set CLAUDE_LB_DATABASE_URL in .env.local:
#   CLAUDE_LB_DATABASE_URL=postgresql+asyncpg://user:password@host:5432/claudelb
#
# NOTE: This Compose file defines a SINGLE-REPLICA topology.
# Do not use `docker compose up --scale server=N` — the published host ports collide
# and Compose provides no per-replica bridge identity. Multi-replica deployments
# require the Helm chart with PostgreSQL and leader election (deploy/helm/claude-lb).
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    ports:
      - "2455:2455"
      - "1455:1455"
    volumes:
      - claude-lb-data:/var/lib/claude-lb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2455/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

networks:
  default:
    driver: bridge

volumes:
  claude-lb-data:
    name: claude-lb-data
