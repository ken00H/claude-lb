apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "claude-lb.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "claude-lb.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  # Database
  CLAUDE_LB_DATABASE_MIGRATE_ON_STARTUP: {{ .Values.config.databaseMigrateOnStartup | toString | quote }}
  CLAUDE_LB_DATABASE_POOL_SIZE: {{ .Values.config.databasePoolSize | toString | quote }}
  CLAUDE_LB_DATABASE_MAX_OVERFLOW: {{ .Values.config.databaseMaxOverflow | toString | quote }}
  # Upstream
  {{- if .Values.config.upstreamBaseUrl }}
  CLAUDE_LB_UPSTREAM_BASE_URL: {{ .Values.config.upstreamBaseUrl | quote }}
  {{- end }}
  CLAUDE_LB_UPSTREAM_CONNECT_TIMEOUT_SECONDS: {{ .Values.config.upstreamConnectTimeout | toString | quote }}
  # Logging
  CLAUDE_LB_LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  # Metrics
  CLAUDE_LB_METRICS_ENABLED: {{ .Values.metrics.enabled | toString | quote }}
  CLAUDE_LB_METRICS_PORT: {{ .Values.metrics.port | toString | quote }}
  # Leader election
  CLAUDE_LB_LEADER_ELECTION_ENABLED: {{ .Values.config.leaderElectionEnabled | toString | quote }}
  CLAUDE_LB_LEADER_ELECTION_TTL_SECONDS: {{ .Values.config.leaderElectionTtlSeconds | toString | quote }}
  # Circuit breaker (failure threshold and recovery timeout are fixed
  # application constants)
  CLAUDE_LB_CIRCUIT_BREAKER_ENABLED: {{ .Values.config.circuitBreakerEnabled | toString | quote }}
  # Backpressure
  CLAUDE_LB_BACKPRESSURE_MAX_CONCURRENT_REQUESTS: {{ .Values.config.backpressureMaxConcurrentRequests | toString | quote }}
  # Shutdown
  CLAUDE_LB_SHUTDOWN_DRAIN_TIMEOUT_SECONDS: {{ .Values.config.shutdownDrainTimeoutSeconds | toString | quote }}
  # HTTP connector
  CLAUDE_LB_HTTP_CONNECTOR_LIMIT: {{ .Values.config.httpConnectorLimit | toString | quote }}
  CLAUDE_LB_HTTP_CONNECTOR_LIMIT_PER_HOST: {{ .Values.config.httpConnectorLimitPerHost | toString | quote }}
  # Session bridge
  # (idle TTLs are fixed application constants: 120s for API sessions, 900s for Codex sessions)
  CLAUDE_LB_HTTP_RESPONSES_SESSION_BRIDGE_ENABLED: {{ .Values.config.sessionBridgeEnabled | toString | quote }}
  CLAUDE_LB_HTTP_RESPONSES_SESSION_BRIDGE_CODEX_PREWARM_ENABLED: {{ .Values.config.sessionBridgeCodexPrewarmEnabled | toString | quote }}
  CLAUDE_LB_HTTP_RESPONSES_SESSION_BRIDGE_MAX_SESSIONS: {{ .Values.config.sessionBridgeMaxSessions | toString | quote }}
  CLAUDE_LB_HTTP_RESPONSES_SESSION_BRIDGE_QUEUE_LIMIT: {{ .Values.config.sessionBridgeQueueLimit | toString | quote }}
  CLAUDE_LB_HTTP_RESPONSES_SESSION_BRIDGE_INSTANCE_RING: {{ .Values.config.sessionBridgeInstanceRing | quote }}
  {{- if .Values.tracing.enabled }}
  CLAUDE_LB_OTEL_ENABLED: "true"
  CLAUDE_LB_OTEL_EXPORTER_ENDPOINT: {{ .Values.tracing.endpoint | quote }}
  {{- end }}
